<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة التحسين الصوتي</title>
</head>
<body>
    <h1>تحسين وظيفة الصوت</h1>
    <button id="speak-button">تحدث</button>

    <script>
        // وظيفة لتحسين الصوت
        function speak(text) {
            const speech = new SpeechSynthesisUtterance();
            speech.lang = 'ar-SA'; // تعيي�� اللغة للعربية
            speech.text = text;
            speech.volume = 1; // مستوى الصوت
            speech.rate = 1; // سرعة الكلام
            speech.pitch = 1; // درجة الصوت

            // بدء التحدث
            window.speechSynthesis.speak(speech);
        }

        document.getElementById('speak-button').addEventListener('click', function() {
            speak('مرحبا! هذه وظيفة تحسين الصوت.'); // النص الذي سيتم التحدث به
        });
    </script>
</body>
</html>
